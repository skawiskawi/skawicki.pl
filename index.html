<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paweł Skawicki</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #08080a;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Dynamiczny Canvas w tle */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Zawartość główna */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      background: rgba(18, 18, 24, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #a5a5b5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #8e8e9f;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #e2e2e8;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.25s ease;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <main class="container">
    <h1>Paweł Skawicki</h1>
    <p class="subtitle">Personal Space & Projects</p>
    
    <div class="links">
      <a href="https://open.spotify.com" target="_blank" rel="noopener" class="link-btn">Spotify Profile</a>
      <a href="https://genius.com" target="_blank" rel="noopener" class="link-btn">Genius Annotations</a>
      <a href="https://stats.fm" target="_blank" rel="noopener" class="link-btn">Stats.fm</a>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Reakcja na myszkę (opcjonalna, z łagodnym przyciąganiem)
    const mouse = { x: width / 2, y: height / 2, active: false };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });

    // --- KONFIGURACJA ORBÓW ---
    const ORB_COUNT = 6;
    const colors = [
      { r: 99, g: 102, b: 241 },  // Indigo
      { r: 168, g: 85, b: 247 },  // Purple
      { r: 236, g: 72, b: 153 },  // Pink
      { r: 59, g: 130, b: 246 },  // Blue
      { r: 16, g: 185, b: 129 }   // Emerald Accent
    ];

    class Orb {
      constructor() {
        this.init();
      }

      init() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 180 + 140; // Duże, rozmyte plamy
        this.color = colors[Math.floor(Math.random() * colors.length)];
        
        // ZZNACZĄCO ZWIĘKSZONA PRĘDKOŚĆ I RUCH BEZ MYSZKI
        this.vx = (Math.random() - 0.5) * 3.5; 
        this.vy = (Math.random() - 0.5) * 3.5;
        
        // Zmienne do płynnej fali sinusoidalnej
        this.angleX = Math.random() * Math.PI * 2;
        this.angleY = Math.random() * Math.PI * 2;
        this.speedX = 0.02 + Math.random() * 0.03;
        this.speedY = 0.02 + Math.random() * 0.03;
        
        this.baseAlpha = 0.35 + Math.random() * 0.25;
      }

      update() {
        // Ruch sinusoidalny (automatyczny, ciągły ruch)
        this.angleX += this.speedX;
        this.angleY += this.speedY;

        this.x += this.vx + Math.sin(this.angleX) * 2.5;
        this.y += this.vy + Math.cos(this.angleY) * 2.5;

        // Wyrzucenie od krawędzi (odbijanie z zapasem)
        if (this.x < -100) this.vx = Math.abs(this.vx);
        if (this.x > width + 100) this.vx = -Math.abs(this.vx);
        if (this.y < -100) this.vy = Math.abs(this.vy);
        if (this.y > height + 100) this.vy = -Math.abs(this.vy);

        // Jeśli mysz jest aktywna, delikatnie reagują
        if (mouse.active) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 350) {
            this.x += (dx / dist) * 0.8;
            this.y += (dy / dist) * 0.8;
          }
        }
      }

      draw() {
        ctx.save();
        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.radius
        );
        
        const { r, g, b } = this.color;
        gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${this.baseAlpha})`);
        gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${this.baseAlpha * 0.4})`);
        gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- KONFIGURACJA BŁYSKÓW (FLASHES / STROBE) ---
    class Flash {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 220 + 80;
        this.alpha = 0;
        // Błyski są znacznie jaśniejsze (max alpha do 0.85)
        this.maxAlpha = 0.5 + Math.random() * 0.35; 
        this.speed = 0.04 + Math.random() * 0.05; // Szybsze zapalanie/gaszenie
        this.stage = 'in'; // 'in' -> rośnie jasność, 'out' -> gaśnie
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        if (this.stage === 'in') {
          this.alpha += this.speed;
          if (this.alpha >= this.maxAlpha) {
            this.stage = 'out';
          }
        } else if (this.stage === 'out') {
          this.alpha -= this.speed * 0.7;
          if (this.alpha <= 0) {
            this.reset();
          }
        }
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        // Nakładanie rozjaśniające dla mocniejszego efektu błysku
        ctx.globalCompositeOperation = 'screen'; 

        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.radius
        );

        const { r, g, b } = this.color;
        // Rdzeń jest czysto biały/jasny przy rozbłysku
        gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
        gradient.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${this.alpha * 0.8})`);
        gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Inicjalizacja obiektów
    const orbs = Array.from({ length: ORB_COUNT }, () => new Orb());
    // Zwiększono liczbę błysków z 2-3 do 7, aby były bardzo częste
    const flashes = Array.from({ length: 7 }, () => new Flash());

    // Główna pętla animacji
    function animate() {
      // Czyszczenie ekranu z zachowaniem lekkiego czarnego tła
      ctx.fillStyle = '#08080a';
      ctx.fillRect(0, 0, width, height);

      // Rysowanie orbów
      orbs.forEach(orb => {
        orb.update();
        orb.draw();
      });

      // Rysowanie jaśniejszych i częstszych błysków
      flashes.forEach(flash => {
        flash.update();
        flash.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
