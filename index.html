  <style>
    :root {
      --bg-dark: #050608;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.07);
      --card-hover-bg: rgba(255, 255, 255, 0.06);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --dynamic-accent: #1ed760;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    #interactive-bg, #strobe-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      pointer-events: none;
    }

    #interactive-bg {
      z-index: 1;
    }

    #strobe-container {
      z-index: 2;
      overflow: hidden;
    }

    .strobe-flash {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.12) 35%, rgba(255, 255, 255, 0.04) 65%, transparent 100%);
      filter: blur(16px);
      opacity: 0;
      mix-blend-mode: screen;
      transform: translate(-50%, -50%);
      transition: opacity 0.06s ease-out;
      will-change: opacity;
    }

    .container {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(12px, 2.5vh, 24px) 20px;
      padding-top: max(clamp(12px, 2.5vh, 24px), env(safe-area-inset-top));
      padding-bottom: max(clamp(12px, 2.5vh, 24px), env(safe-area-inset-bottom));
      perspective: 1000px;
    }

    .header-spacer {
      height: 1px;
    }

    .main-content {
      width: 100%;
      max-width: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.5vh, 22px);
    }

    .sound-wave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 28px;
      opacity: 0.9;
      user-select: none;
      filter: drop-shadow(0 0 12px var(--dynamic-accent));
      transition: filter 0.8s ease;
    }

    .bar {
      width: 3.5px;
      height: 100%;
      background: linear-gradient(180deg, #38bdf8, var(--dynamic-accent), #f43f5e);
      border-radius: 99px;
      animation: pulse-fast 0.6s ease-in-out infinite alternate;
      will-change: transform;
      transition: background 0.8s ease;
    }

    .bar:nth-child(1) { animation-duration: 0.42s; height: 60%; }
    .bar:nth-child(2) { animation-duration: 0.58s; height: 90%; }
    .bar:nth-child(3) { animation-duration: 0.35s; height: 100%; }
    .bar:nth-child(4) { animation-duration: 0.51s; height: 75%; }
    .bar:nth-child(5) { animation-duration: 0.39s; height: 85%; }
    .bar:nth-child(6) { animation-duration: 0.48s; height: 95%; }
    .bar:nth-child(7) { animation-duration: 0.54s; height: 65%; }

    @keyframes pulse-fast {
      0% { transform: scaleY(0.15); }
      100% { transform: scaleY(1); }
    }

    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 42px;
      padding: 9px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.15s ease-out, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .link-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    @media (hover: hover) {

      .link-btn.statsfm:hover { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 0 18px rgba(168, 85, 247, 0.2); }
      .link-btn.fortnite:hover { border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 0 18px rgba(56, 189, 248, 0.2); }
    }

    .link-btn:active {
      transform: scale(0.97) !important;
    }

    .section-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 6px 0 2px 0;
      gap: 12px;
    }

    .section-divider::before, .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .section-divider span {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.3);
    }

    .spotify-widget {

      -webkit-backdrop-filter: blur(24px);

      align-items: center;

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
      will-change: transform;
      transform-style: preserve-3d;

    .spotify-widget::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;

      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }

    .spotify-widget::after {
      content: '';
      position: absolute;
      inset: 1px;
      background: #090a0f;
      border-radius: 15px;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes border-beam {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spotify-widget-content {

      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .album-cover-wrapper {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
    }

    .album-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      flex: 1;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--dynamic-accent);
      margin-bottom: 2px;
      transition: color 0.8s ease;
    }

    .eq-mini {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 8px;
    }

    .eq-bar {
      width: 1.5px;
      height: 100%;
      background-color: var(--dynamic-accent);
      animation: eq-bounce 0.8s ease-in-out infinite alternate;
      transition: background-color 0.8s ease;
    }

    .eq-bar:nth-child(1) { animation-duration: 0.5s; }
    .eq-bar:nth-child(2) { animation-duration: 0.7s; }
    .eq-bar:nth-child(3) { animation-duration: 0.4s; }

    @keyframes eq-bounce {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    .track-title {
      font-size: 0.80rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.70rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 2;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--dynamic-accent);
      transition: width 0.4s linear, background-color 0.8s ease;
    }

    footer {
      text-align: center;
    }

    .footer-text {
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      font-weight: 500;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #94a3b8, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: lowercase;
      user-select: none;
      padding-left: 6px;
    }

    @media (max-width: 768px) {
      #interactive-bg { opacity: 0.85; filter: saturate(0.8); }
    }

    @media (max-height: 600px) {
      .sound-wave { display: none; }
      .main-content { gap: 12px; }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let targetHueOffset = 0;
      let currentHueOffset = 0;

      const canvas = document.getElementById('interactive-bg');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };
        let isTouching = false;

        window.addEventListener('resize', () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        function updatePointer(e) {
          let touch = e.touches ? e.touches[0] : null;
          const x = touch ? touch.clientX : e.clientX;
          const y = touch ? touch.clientY : e.clientY;
          if (x !== undefined && y !== undefined) {
            mouse.targetX = x;
            mouse.targetY = y;
            isTouching = true;
          }
        }

        window.addEventListener('mousemove', updatePointer);
        window.addEventListener('touchstart', updatePointer, { passive: true });
        window.addEventListener('touchmove', updatePointer, { passive: true });

        const blobs = [
          { x: width * 0.3, y: height * 0.3, radius: 420, baseHue: 260, speed: 0.0012, factor: 0.25 },
          { x: width * 0.7, y: height * 0.6, radius: 460, baseHue: 320, speed: 0.0009, factor: -0.25 },
          { x: width * 0.5, y: height * 0.4, radius: 380, baseHue: 190, speed: 0.0015, factor: 0.30 },
          { x: width * 0.2, y: height * 0.8, radius: 400, baseHue: 20, speed: 0.0008, factor: -0.20 }
        ];

        let time = 0;
        function renderCanvas() {
          time += 1;

          if (!isTouching) {
            mouse.targetX = width / 2 + Math.sin(time * 0.012) * (width * 0.35);
            mouse.targetY = height / 2 + Math.cos(time * 0.008) * (height * 0.35);
          }

          mouse.x += (mouse.targetX - mouse.x) * 0.05;
          mouse.y += (mouse.targetY - mouse.y) * 0.05;
          currentHueOffset += (targetHueOffset - currentHueOffset) * 0.015;

          ctx.clearRect(0, 0, width, height);
          ctx.fillStyle = '#050608';
          ctx.fillRect(0, 0, width, height);

          blobs.forEach((blob, index) => {
            const orbitX = Math.sin(time * blob.speed + index * 2) * (width * 0.25);
            const orbitY = Math.cos(time * blob.speed * 0.8 + index) * (height * 0.25);
            const mouseOffsetX = (mouse.x - width / 2) * blob.factor;
            const mouseOffsetY = (mouse.y - height / 2) * blob.factor;

            const currentX = (blob.x + orbitX + mouseOffsetX);
            const currentY = (blob.y + orbitY + mouseOffsetY);

            const hue = (blob.baseHue + currentHueOffset + Math.sin(time * 0.001 + index) * 20) % 360;
            const colorCenter = `hsla(${hue}, 85%, 52%, 0.42)`;
            const colorEdge = `hsla(${hue}, 85%, 52%, 0)`;

            const gradient = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, blob.radius);
            gradient.addColorStop(0, colorCenter);
            gradient.addColorStop(1, colorEdge);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(currentX, currentY, blob.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          requestAnimationFrame(renderCanvas);
        }
        renderCanvas();
      }

      const strobeContainer = document.getElementById('strobe-container');
      if (strobeContainer) {
        function triggerMultiFlash() {
          const count = Math.floor(Math.random() * 3) + 2;
          const elements = [];

          for (let i = 0; i < count; i++) {
            const flash = document.createElement('div');
            flash.className = 'strobe-flash';
            const size = Math.floor(Math.random() * 250) + 350;
            const posX = Math.random() * window.innerWidth;
            const posY = Math.random() * window.innerHeight;

            flash.style.width = `${size}px`;
            flash.style.height = `${size}px`;
            flash.style.left = `${posX}px`;
            flash.style.top = `${posY}px`;

            strobeContainer.appendChild(flash);
            elements.push(flash);
          }

          requestAnimationFrame(() => {
            const targetOpacity = (Math.random() * 0.15 + 0.12).toFixed(2);
            elements.forEach(el => el.style.opacity = targetOpacity);
          });

          const flashDuration = Math.random() * 70 + 60;
          setTimeout(() => {
            elements.forEach(el => {
              el.style.opacity = '0';
              setTimeout(() => el.remove(), 120);
            });
          }, flashDuration);

          const nextFlashDelay = Math.random() * 3500 + 2500;
          setTimeout(triggerMultiFlash, nextFlashDelay);
        }

        setTimeout(triggerMultiFlash, 1500);
      }

      function extractDominantHue(imgElement) {
        try {
          const c = document.createElement('canvas');
          const ctx = c.getContext('2d');
          c.width = 40;
          c.height = 40;
          ctx.drawImage(imgElement, 0, 0, 40, 40);

          const imgData = ctx.getImageData(0, 0, 40, 40).data;
          let r = 0, g = 0, b = 0, count = 0;

          for (let i = 0; i < imgData.length; i += 16) {
            r += imgData[i];
            g += imgData[i + 1];
            b += imgData[i + 2];
            count++;
          }

          r = Math.round(r / count);
          g = Math.round(g / count);
          b = Math.round(b / count);

          r /= 255; g /= 255; b /= 255;
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          let h = 0;

          if (max !== min) {
            const d = max - min;
            switch (max) {
              case r: h = (g - b) / d + (g < b ? 6 : 0); break;
              case g: h = (b - r) / d + 2; break;
              case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
          }

          return Math.round(h * 360);
        } catch (e) {
          return null;
        }
      }

      const tiltCards = document.querySelectorAll('.tilt-card');
      tiltCards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = ((y - centerY) / centerY) * -8;
          const rotateY = ((x - centerX) / centerX) * 8;

          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)`;
        });
      });

      const SPOTIFY_CONFIG = {
        CLIENT_ID: '2d54be40e04943efa086ed8358ab169c',
        CLIENT_SECRET: '09ee688d79a24eb9a1148d573a814bac',
        REFRESH_TOKEN: 'AQDM9YXagkIir6H-QPfVa5MIcNJHqCNTi3GOnvOQ91QEEQg2CDCVuMicMqxHyOgxWqa746kwtHy7PLdhdWGPWiw3w29n0qkB7y1yahCX3ldFd8EMyQvnfYkWNJOk423Ydhc'
      };

      const TOKEN_ENDPOINT = `https://accounts.spotify.com/api/token`;
      const NOW_PLAYING_ENDPOINT = `https://api.spotify.com/v1/me/player/currently-playing`;
      const RECENTLY_PLAYED_ENDPOINT = `https://api.spotify.com/v1/me/player/recently-played?limit=1`;

      let cachedAccessToken = null;

      async function getAccessToken() {
        if (cachedAccessToken) return cachedAccessToken;

        try {
          const basic = btoa(`${SPOTIFY_CONFIG.CLIENT_ID}:${SPOTIFY_CONFIG.CLIENT_SECRET}`);
          const response = await fetch(TOKEN_ENDPOINT, {
            method: 'POST',
            headers: {
              'Authorization': `Basic ${basic}`,
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({
              grant_type: 'refresh_token',
              refresh_token: SPOTIFY_CONFIG.REFRESH_TOKEN
            })
          });

          if (!response.ok) return null;

          const data = await response.json();
          cachedAccessToken = data.access_token;

          setTimeout(() => {
            cachedAccessToken = null;
          }, 3500000);

          return cachedAccessToken;
        } catch (err) {
          return null;
        }
      }

      async function fetchSpotifyApi(endpoint) {
        let token = await getAccessToken();
        if (!token) return null;

        let res = await fetch(endpoint, {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 401) {
          cachedAccessToken = null;
          token = await getAccessToken();
          if (!token) return null;
          res = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${token}` }
          });
        }

        return res;
      }

      async function getSpotifyStatus() {
        try {
          const nowPlayingRes = await fetchSpotifyApi(NOW_PLAYING_ENDPOINT);
          if (nowPlayingRes && nowPlayingRes.status === 200) {
            const data = await nowPlayingRes.json();
            if (data && data.item) {
              return {
                isPlaying: data.is_playing,
                isRecentlyPlayed: false,
                title: data.item.name,
                artist: data.item.artists.map(a => a.name).join(', '),
                albumImageUrl: data.item.album.images[0]?.url,
                songUrl: data.item.external_urls.spotify,
                progressMs: data.progress_ms,
                durationMs: data.item.duration_ms
              };
            }
          }

          const recentlyRes = await fetchSpotifyApi(RECENTLY_PLAYED_ENDPOINT);
          if (recentlyRes && recentlyRes.status === 200) {
            const recentData = await recentlyRes.json();
            const lastTrack = recentData.items[0]?.track;
            if (lastTrack) {
              return {
                isPlaying: false,
                isRecentlyPlayed: true,
                title: lastTrack.name,
                artist: lastTrack.artists.map(a => a.name).join(', '),
                albumImageUrl: lastTrack.album.images[0]?.url,
                songUrl: lastTrack.external_urls.spotify,
                progressMs: 0,
                durationMs: 0
              };
            }
          }

          return { isPlaying: false, isRecentlyPlayed: false };
        } catch (err) {
          return { isPlaying: false, isRecentlyPlayed: false };
        }
      }

      async function updateSpotifyCard() {
        const track = await getSpotifyStatus();
        const card = document.getElementById('spotify-card');
        const cover = document.getElementById('spotify-cover');
        const title = document.getElementById('spotify-title');
        const artist = document.getElementById('spotify-artist');
        const statusText = document.getElementById('spotify-status-text');
        const eqIcon = document.getElementById('eq-icon');
        const progressBar = document.getElementById('spotify-progress');

        if (!card || !cover || !title || !artist || !statusText || !eqIcon || !progressBar) return;

        if (track.title) {
          if (cover.dataset.rawSrc !== track.albumImageUrl) {
            cover.dataset.rawSrc = track.albumImageUrl;
            cover.src = track.albumImageUrl;
            cover.onload = () => {
              const extractedHue = extractDominantHue(cover);
              if (extractedHue !== null) {
                targetHueOffset = extractedHue;
                document.documentElement.style.setProperty('--dynamic-accent', `hsl(${extractedHue}, 65%, 50%)`);
              };
            };
          }

          title.innerText = track.title;
          artist.innerText = track.artist;
          card.href = track.songUrl || 'https://open.spotify.com';

          if (track.isPlaying) {
            statusText.innerText = 'Now Playing';
            eqIcon.style.display = 'flex';
            if (track.progressMs && track.durationMs) {
              const pct = (track.progressMs / track.durationMs) * 100;
              progressBar.style.width = `${pct}%`;
            }
          } else {
            statusText.innerText = 'Ostatnio słuchane';
            eqIcon.style.display = 'none';
            progressBar.style.width = '0%';
          }
        } else {
          title.innerText = 'Brak aktywności';
          artist.innerText = 'Nic obecnie nie leci';
          card.href = 'https://open.spotify.com';
          statusText.innerText = 'Spotify';
          eqIcon.style.display = 'none';
          progressBar.style.width = '0%';
        }
      }

      updateSpotifyCard();
      setInterval(updateSpotifyCard, 5000);
    });
  </script>
